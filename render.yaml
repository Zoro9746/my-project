services:
  - type: web
    name: bit-health-center
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
